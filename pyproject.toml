[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "A small, dependency-free command-line log file analyzer: level counts, top errors, filtering and rate buckets."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ruizhao Zheng"}
]
keywords = ["log", "log-analysis", "cli", "devops", "observability"]

[project.scripts]
loglens = "loglens.cli:main"

[tool.setuptools]
packages = ["loglens"]
